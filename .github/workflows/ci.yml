name: KS model CI

# CI for the TCR signaling case study, deliberately kept in THIS repo rather
# than in the parent framework (metamodeler_codex_scaffold_docs).
#
# Rationale: this project has a native CMake/Metal build and its own pytest
# config, and it fails for reasons that have nothing to do with the framework
# (toolchain, Metal, physics regressions). Running it as a job inside the
# framework's workflow would make the framework's status red for submodule
# reasons — the cry-wolf problem. Separate repo, separate workflow, separate
# badge and notifications.
#
# These tests import no framework code at all — only numpy/scipy/matplotlib —
# so nothing needs to be installed from the parent repo.
#
# Windows was deliberately absent until 2026-08-11, on the reasoning that no
# real user ran the native KS model there. That condition no longer holds — a
# student hit exactly this — so the job the old comment said to build "when an
# actual Windows user appears" is now in the matrix below, native MSVC as
# recommended (MSYS2 would only have been a third GCC build of the same
# gpu_stub.c path ubuntu already covers, proving nothing a Windows user needs).
#
# The portability work that unblocked it: src/ks_compat.h (_USE_MATH_DEFINES for
# M_PI), a WIN32 branch in CMakeLists.txt (WINDOWS_EXPORT_ALL_SYMBOLS plus
# per-config output dirs for the multi-config VS generator), and ks_build.py,
# which is now the single place that knows the `.exe` suffix, the `.dll` naming
# and how to invoke cmake instead of `make`. tests/test_portability.py fails if
# any of that is undone.

on:
  push:
    branches: ["**"]
  pull_request:
  # Daily. This was weekly until Windows joined the matrix: a stock Windows box
  # picks up MSVC and SDK updates on Microsoft's schedule, not ours, and the
  # runner image moves under us too, so a toolchain break here has no push to
  # ride in on. Offset one hour from the framework's schedule so the two runs
  # are easy to tell apart in notifications.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  ks-model:
    name: ${{ matrix.os }} / KS model
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS exercises the Metal backend. Linux and Windows both exercise the
        # gpu_stub.c CPU fallback, but they are NOT redundant: Windows is the
        # only job compiling with MSVC rather than GCC/Clang, so it is the only
        # one that catches a glibc/libc++ assumption, a POSIX-only call, or a
        # C11 conformance gap. That is the signal it exists for.
        os: [macos-latest, ubuntu-latest, windows-latest]

    defaults:
      run:
        # bash everywhere, so one script works on all three. Present on the
        # Windows runners (Git for Windows); without this they default to
        # PowerShell and the heredoc in the skip-audit step below dies.
        shell: bash

    env:
      # Windows runners ship tkinter, so matplotlib would pick TkAgg and block
      # on a display that does not exist when the notebooks render figures.
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain info
        run: |
          cmake --version
          case "$RUNNER_OS" in
            macOS)   c++ --version; xcrun --show-sdk-path ;;
            Linux)   c++ --version ;;
            # No `c++` on Windows; cl.exe is only on PATH inside a developer
            # shell, which CMake sets up itself. Report what CMake will pick.
            Windows) cmake --system-information 2>/dev/null | grep -i -m3 "CMAKE_CXX_COMPILER\b" || true ;;
          esac

      - name: Install test dependencies
        # nbclient/nbformat are for the tutorial-notebook step below; the notebooks
        # themselves import nothing beyond numpy/matplotlib, so no framework here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib pytest nbclient nbformat ipykernel

      - name: Build KS model
        working-directory: models/kinetic_segregation
        # cmake directly rather than `make`: the Makefile is a convenience
        # wrapper for Unix humans and there is no make on a Windows runner.
        # --config Release is a no-op for single-config generators and is what
        # selects the configuration for the Visual Studio one.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Show what was built
        working-directory: models/kinetic_segregation
        # If the executable or the ctypes DLL lands somewhere unexpected, every
        # dependent test skips and the run looks green. Print the artifacts so a
        # path regression is visible in the log even before the audit below.
        run: |
          ls -l ks_gpu ks_gpu.exe 2>/dev/null || true
          find build -maxdepth 2 \( -name "*ks_potentials*" -o -name "ks_gpu*" \) -print

      - name: Run fast test suite
        # `deterministic` is deselected: bit-level reproducibility baselines that
        # CLAUDE.md documents as platform-specific, and a hosted runner is
        # different hardware. Metal-only tests are NOT deselected here — they
        # skip themselves via conftest with a stated reason, and the guard below
        # checks that reason.
        run: python -m pytest -q -m "not slow and not deterministic" --junit-xml=results.xml

      - name: Assert the suite ran, and that every skip is justified
        # Two failure modes this catches:
        #  1. A silent collapse — every C++ test skips itself when the binary is
        #     missing, so a toolchain regression can yield 150+ skips and exit 0.
        #     A broken libc++ recently turned 118 of these into skips reading as
        #     success.
        #  2. Skip creep — a test quietly skipping for an unvetted reason. Only
        #     the Metal gate is allowed to skip, and only off macOS. Anything
        #     else fails, so skipping is never a blank cheque.
        if: always()
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET

          ALLOWED_SKIP = "requires Metal GPU backend"
          TOTAL_FLOOR = 183        # 188 collected today; headroom without hiding a collapse
          root = ET.parse("results.xml").getroot()
          suite = root.find("testsuite")
          if suite is None:
              suite = root

          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          failures = int(suite.get("failures", 0))
          errors = int(suite.get("errors", 0))
          passed = total - skipped - failures - errors
          is_macos = os.environ.get("RUNNER_OS_NAME") == "macOS"
          print(f"os={os.environ.get('RUNNER_OS_NAME')} total={total} passed={passed} "
                f"skipped={skipped} failed={failures} errors={errors}")

          problems = []
          if total < TOTAL_FLOOR:
              problems.append(f"only {total} tests collected, floor is {TOTAL_FLOOR}")

          # Every skip must carry the one sanctioned reason.
          unjustified = []
          for case in suite.iter("testcase"):
              for sk in case.findall("skipped"):
                  reason = (sk.get("message") or "") + (sk.text or "")
                  if ALLOWED_SKIP not in reason:
                      unjustified.append(f"{case.get('classname')}::{case.get('name')} -> {reason[:120]}")
          if unjustified:
              problems.append("skips without a sanctioned reason:\n    " + "\n    ".join(unjustified))

          # On macOS the Metal backend is present, so nothing may skip at all.
          if is_macos and skipped:
              problems.append(f"{skipped} test(s) skipped on macOS, where Metal is available — expected 0")

          if problems:
              sys.exit("FAIL: " + "; ".join(problems))
          print(f"OK: {passed} passed, {skipped} justified skip(s).")
          PY

      - name: Execute the KS tutorial notebooks
        # Marked `slow` so they stay out of the pre-commit hook, but they run here:
        # nothing else executes them, which is exactly how 01_explore_models.ipynb
        # came to sit broken for months. Each notebook asserts its own scientific
        # claims and prints a beacon; the test requires that beacon, so a notebook
        # that runs but does nothing still fails.
        run: python -m pytest -q -m slow models/kinetic_segregation/tests/test_notebooks.py
