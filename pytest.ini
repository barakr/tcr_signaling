[pytest]
addopts = -q
testpaths = models
filterwarnings =
    error
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    deterministic: bit-level determinism tests (platform-specific, skip on new hardware with '-m "not deterministic"')
    requires_metal: needs the Metal GPU backend; auto-skipped off macOS by conftest (see there for why)
